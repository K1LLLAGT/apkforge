name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build engine + app
        run: ./gradlew --stacktrace :engine:test :engine:installDist :app:assembleDebug :app:assembleRelease :app:bundleDebug

      - name: Check dex API level (minSdk 26)
        run: |
          python3 -B -m unittest discover -s tools -p 'test_check_dex_api.py'
          python3 tools/check-dex-api.py app/build/outputs/apk/debug/app-debug.apk 26 "$ANDROID_HOME"

      - name: Engine smoke test (decompile -> rebuild -> verify)
        run: tools/engine-smoke.sh

      - name: CLI syntax and compare test
        run: |
          bash -n cli/apkforge
          tools/cli-compare-test.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: ApkForge-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: ApkForge-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload smoke-test projects (info + logs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-logs-${{ github.run_number }}
          path: |
            build/smoke/**/info.txt
            build/smoke/**/decompile.log
            build/smoke/*.txt
          if-no-files-found: ignore

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk ApkForge.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ApkForge.apk (${{ github.ref_name }})
          files: ApkForge.apk
          generate_release_notes: true
